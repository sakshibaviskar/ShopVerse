<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sakshi's ShopVerse</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">ShopVerse ✨</div>
    <a href="#" class="github-link">My Projects</a>
  </header>

  <!-- HERO -->
  <section class="hero">
    <h1>My Frontend Shop Collection 💖</h1>
    <p>
      Beautifully designed mini e-commerce websites built using  
      <strong>HTML, CSS & JavaScript</strong>
    </p>
  </section>

  <!-- PROJECTS -->
  <section class="projects-section">
    <h2>Featured Project 🌷</h2>

    <div id="projectsGrid" class="projects-grid"></div>
  </section>

  <!-- STATS -->
  <section class="stats-section">
    <div class="stat">
      <h3 id="projectCount">0</h3>
      <span>Total Projects</span>
    </div>

    <div class="stat">
      <h3>HTML • CSS • JS</h3>
      <span>Tech Stack</span>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    Made with 💕 by Sakshi
  </footer>

  <script src="script.js"></script>
</body>
</html>
